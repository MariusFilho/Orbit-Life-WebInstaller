<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b14">
  <title>Orbit-Life · Instalador Web</title>
  <style>
    /* Paleta do próprio Orbit-Life: fundo quase preto da interface + ciano do Orbi + âmbar do anel */
    :root { --bg:#070a12; --bg2:#0d1322; --card:#0e1424; --line:#1c2640; --txt:#eaf0fa; --muted:#8c97ae;
            --teal:#1ad1c4; --teal2:#0f8f89; --amber:#ffab1f; --violet:#9b6bff; --ok:#3ddc84; --err:#ff5c5c; }
    * { box-sizing:border-box; }
    html { -webkit-text-size-adjust:100%; }
    body { margin:0; min-height:100vh; color:var(--txt); background:var(--bg);
           font-family: Montserrat, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height:1.5; }
    /* fundo: um único brilho suave, igual ao tom da tela do aparelho */
    body::before { content:""; position:fixed; inset:0; z-index:-1;
                   background: radial-gradient(60% 50% at 25% 15%, #11203a 0%, transparent 70%); }
    .wrap { max-width:1040px; margin:0 auto; padding:20px 20px; display:grid; gap:36px;
            grid-template-columns: 1fr 1fr; align-items:center; min-height:100vh; }

    /* ---------- palco: o aparelho + órbita ---------- */
    .stage { display:grid; place-items:center; }
    #ring { --p:0; position:relative; width:min(78vw, 340px, 62vh); aspect-ratio:1; }
    #ring svg.orbit { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
    .orbit .track { fill:none; stroke:var(--line); stroke-width:.5; }
    .orbit .prog { fill:none; stroke:var(--teal); stroke-width:1.7; stroke-linecap:round; opacity:0;
                   stroke-dasharray:100 100; stroke-dashoffset:calc(100 - var(--p)); transform:rotate(-90deg); transform-origin:50% 50%;
                   transition: stroke-dashoffset .25s ease, opacity .3s; }
    #ring.busy .prog { opacity:1; }
    .orbit .moon { fill:var(--violet); }
    .spin { transform-origin:50% 50%; animation: spin 9s linear infinite; }
    .spin.rev { animation-duration:14s; animation-direction:reverse; }
    .orbit .moon2 { fill:var(--violet); opacity:.75; }
    .orbit .track2 { fill:none; stroke:var(--line); stroke-width:.35; stroke-dasharray:1 2; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .disc { position:absolute; inset:9%; border-radius:50%; display:grid; place-items:center; text-align:center;
            background: radial-gradient(circle at 50% 38%, #101a30 0%, #080b14 72%); border:1px solid var(--line); }
    .disc img { width:72%; height:auto; display:block; margin-top:-4%; }
    .disc .word { position:absolute; bottom:15%; left:0; right:0; font-weight:700; letter-spacing:.34em; font-size:clamp(13px,3.4vw,19px);
                  padding-left:.34em; }
    #ring.busy .word { visibility:hidden; }
    #ringtxt { position:absolute; bottom:14%; left:0; right:0; font-weight:700; font-size:clamp(18px,5vw,26px); color:var(--teal); }
    #ring:not(.busy) #ringtxt { display:none; }

    /* ---------- painel ---------- */
    .panel { display:grid; gap:14px; }
    h1 { margin:0; font-size:clamp(26px,4vw,34px); letter-spacing:.2em; line-height:1.1; }
    h1 small { display:block; margin-top:6px; font-size:14px; letter-spacing:.04em; font-weight:500; color:var(--muted); }
    #fwver { margin:-6px 0 0; font-size:13px; color:var(--muted); letter-spacing:.04em; }
    .lead { margin:0; color:#c3cbdb; font-size:14.5px; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; margin:0; padding:0; list-style:none; }
    .chips li { font-size:12.5px; padding:5px 12px; border-radius:999px; border:1px solid var(--line); background:#0b1120; color:#b7c1d6; }
    .chips li i { font-style:normal; color:var(--teal); margin-right:6px; }

    .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:18px 20px; }
    .steps { list-style:none; counter-reset:s; margin:0 0 14px; padding:0; display:grid; gap:10px; }
    .steps li { counter-increment:s; position:relative; padding-left:40px; color:var(--muted); font-size:13.5px; min-height:28px; }
    .steps li::before { content:counter(s); position:absolute; left:0; top:0; width:27px; height:27px; border-radius:50%;
                        border:2px solid var(--teal2); color:var(--teal); display:grid; place-items:center; font-weight:700; font-size:14px; }
    .steps b { color:var(--txt); }
    .you { display:inline-block; margin-left:6px; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
           color:#1a1203; background:var(--amber); border-radius:999px; padding:1px 8px; vertical-align:2px; }

    .req { margin:0 0 14px; padding:9px 12px; border-radius:14px; background:#0a101e; border:1px dashed #263253; font-size:13.5px; color:var(--muted); }
    .req b { color:var(--txt); }

    button#install { width:100%; background:linear-gradient(90deg, var(--teal), #46a0ff); color:#04141a; border:0; border-radius:999px;
                     padding:13px 24px; font-size:16px; font-weight:700; letter-spacing:.02em; cursor:pointer; font-family:inherit; }
    button#install:hover:not(:disabled) { filter:brightness(1.08); }
    button#install:focus-visible { outline:3px solid var(--amber); outline-offset:3px; }
    button#install:disabled { opacity:.5; cursor:default; }
    #status { margin-top:10px; min-height:1.5em; font-weight:600; font-size:14.5px; text-align:center; }
    #status.ok { color:var(--ok); } #status.err { color:var(--err); }
    details { margin-top:12px; }
    summary { cursor:pointer; color:var(--muted); font-size:13px; }
    pre#log { margin:8px 0 0; max-height:150px; overflow:auto; background:#080d19; border:1px solid var(--line);
              border-radius:12px; padding:12px; font-size:12px; line-height:1.45; color:#b9c2d6; white-space:pre-wrap; }
    .warn { margin:12px 0 0; font-size:13px; color:var(--muted); }
    .warn b { color:var(--amber); }
    footer { font-size:12px; color:#5d6880; line-height:1.6; }

    @media (max-width: 860px) {
      .wrap { grid-template-columns:1fr; min-height:0; padding-top:24px; }
      #ring { width:min(70vw, 300px); }
      .panel { text-align:left; }
    }
    /* idioma */
    .lang { position:fixed; top:14px; right:16px; display:flex; gap:4px; padding:4px; border-radius:999px;
            background:#0b1120; border:1px solid var(--line); z-index:5; }
    .lang button { border:0; background:none; color:var(--muted); font-family:inherit; font-size:12px; font-weight:600;
                   line-height:1; padding:6px 10px; border-radius:999px; cursor:pointer; }
    .lang button[aria-pressed="true"] { background:var(--teal); color:#04141a; }
    .lang button:focus-visible { outline:2px solid var(--amber); }
    /* as luas giram sempre (fazem parte do logo); com movimento reduzido so ficam mais lentas */
    @media (prefers-reduced-motion: reduce) { .spin { animation-duration:30s; } .spin.rev { animation-duration:45s; } .orbit .prog { transition:none; } }
  </style>
</head>

    try { localStorage.setItem("lang", l); } catch (_) {}
    document.documentElement.lang = l === "pt" ? "pt-BR" : l;
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.innerHTML = T(el.dataset.i18n); });
    document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.l === l));
    if (fw) $("fwver").textContent = T("ver")(fw);
    if (lastStatus) setStatus(lastStatus.k, lastStatus.cls, lastStatus.extra);
  }

  const $ = (id) => document.getElementById(id);
  const btn = $("install"), statusEl = $("status"), logEl = $("log");
  const log = (s) => { logEl.textContent += s; logEl.scrollTop = logEl.scrollHeight; };
  const terminal = { clean() { logEl.textContent = ""; }, writeLine(d) { log(d + "\n"); }, write(d) { log(d); } };
  const setStatus = (k, cls = "", extra = "") => { lastStatus = { k, cls, extra }; statusEl.textContent = T(k) + extra; statusEl.className = cls; };
  const setProgress = (pct) => {
    $("ring").classList.add("busy");
    $("ring").style.setProperty("--p", pct);
    $("ringtxt").textContent = pct + "%";
  };

  fetch("version.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : null).then(v => {
    if (v) { fw = v; $("fwver").textContent = T("ver")(v); }
  }).catch(() => {});

  document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => applyLang(b.dataset.l)));
  applyLang(lang);

  if (!("serial" in navigator)) {
    btn.disabled = true;
    setStatus("noSerial", "err");
  }

  btn.addEventListener("click", async () => {
    let transport;
    btn.disabled = true;
    terminal.clean();
    lastStatus = null;
    try {
      const port = await navigator.serial.requestPort({});
      setStatus("dl");
      const resp = await fetch(FIRMWARE, { cache: "no-cache" });
      if (!resp.ok) throw new Error(`Falha ao baixar ${FIRMWARE}: HTTP ${resp.status}`);
      const data = new Uint8Array(await resp.arrayBuffer());
      log(`Firmware: ${data.length} bytes\n`);

      setStatus("conn");
      transport = new Transport(port, false);
      const loader = new ESPLoader({ transport, baudrate: 115200, romBaudrate: 115200, terminal });
      const chip = await loader.main();
      if (!String(chip).includes("ESP32-S3")) throw new Error(`Chip detectado: ${chip}. Esperado ESP32-S3 (vire o conector USB-C).`);

      if (!loader.IS_STUB) {
        // Igual ao esptool.py: a ROM so liga a flash se pedirmos (SPI_ATTACH, 8 bytes: hspi_arg + is_legacy)
        // e precisa saber o tamanho dela (SPI_SET_PARAMS). O esptool-js pula isso no Secure Download Mode.
        log("Enabling default SPI flash mode...\n");
        await loader.checkCommand("configure SPI flash pins", loader.ESP_SPI_ATTACH, new Uint8Array(8));
        const p = new DataView(new ArrayBuffer(24));
        [0, 16 * 1024 * 1024, 64 * 1024, 4 * 1024, 256, 0xffff].forEach((v, i) => p.setUint32(i * 4, v, true));
        await loader.checkCommand("set SPI params", 0x0b, new Uint8Array(p.buffer));
        // Sem stub quem grava e a ROM, que so aceita blocos de 1 KB (o esptool-js deixa 16 KB, tamanho do stub).
        loader.FLASH_WRITE_SIZE = loader.chip.FLASH_WRITE_SIZE || 0x400;
        log(`Block size: 0x${loader.FLASH_WRITE_SIZE.toString(16)}\n`);
      }

      setStatus("wr");
      setProgress(0);
      await loader.writeFlash({
        fileArray: [{ data, address: 0x0 }],
        flashSize: "16MB",
        flashMode: "keep",
        flashFreq: "keep",
        eraseAll: false,
        compress: false,          // igual ao upload do VS Code (--no-compress)
        reportProgress: (_i, written, total) => setProgress(Math.floor((written / total) * 100)),
      });
      setProgress(100);
      // Reinicia o Knob sozinho. O loader.after("hard_reset") do esptool-js so SOLTA o RTS; sem antes
      // SEGURAR o reset (RTS=1, DTR=0) nada acontece. Mesma sequencia do esptool.py e do ESP Web Tools.
      log("Reiniciando a placa...\n");
      await transport.setDTR(false);
      await transport.setRTS(true);
      await new Promise((r) => setTimeout(r, 200));
      await transport.setRTS(false);
      await new Promise((r) => setTimeout(r, 300));
      setStatus("done", "ok");
    } catch (err) {
      console.error(err);
      log("\nERRO: " + (err && err.message ? err.message : err) + "\n");
      $("det").open = true;
      if (err && err.name === "NotFoundError") setStatus("noPort", "err"); else setStatus("fail", "err", String(err.message || err));
    } finally {
      try { if (transport) await transport.disconnect(); } catch (_) {}
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
