<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b14">
  <title>Orbit-Life · Instalador Web</title>
  <style>
    /* Paleta do próprio Orbit-Life: fundo quase preto da interface + ciano do Orbi + âmbar do anel */
    :root { --bg:#070a12; --bg2:#0d1322; --card:#0e1424; --line:#1c2640; --txt:#eaf0fa; --muted:#8c97ae;
            --teal:#1ad1c4; --teal2:#0f8f89; --amber:#ffab1f; --violet:#9b6bff; --ok:#3ddc84; --err:#ff5c5c; }
    * { box-sizing:border-box; }
    html { -webkit-text-size-adjust:100%; }
    body { margin:0; min-height:100vh; color:var(--txt); background:var(--bg);
           font-family: Montserrat, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height:1.5; }
    /* fundo: um único brilho suave, igual ao tom da tela do aparelho */
    body::before { content:""; position:fixed; inset:0; z-index:-1;
                   background: radial-gradient(60% 50% at 25% 15%, #11203a 0%, transparent 70%); }
    .wrap { max-width:1040px; margin:0 auto; padding:20px 20px; display:grid; gap:36px;
            grid-template-columns: 1fr 1fr; align-items:center; min-height:100vh; }

    /* ---------- palco: o aparelho + órbita ---------- */
    .stage { display:grid; place-items:center; }
    #ring { --p:0; position:relative; width:min(78vw, 340px, 62vh); aspect-ratio:1; }
    #ring svg.orbit { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
    .orbit .track { fill:none; stroke:var(--line); stroke-width:.5; }
    .orbit .prog { fill:none; stroke:var(--teal); stroke-width:1.7; stroke-linecap:round; opacity:0;
                   stroke-dasharray:100 100; stroke-dashoffset:calc(100 - var(--p)); transform:rotate(-90deg); transform-origin:50% 50%;
                   transition: stroke-dashoffset .25s ease, opacity .3s; }
    #ring.busy .prog { opacity:1; }
    .orbit .moon { fill:var(--violet); }
    .spin { transform-origin:50% 50%; animation: spin 9s linear infinite; }
    .spin.rev { animation-duration:14s; animation-direction:reverse; }
    .orbit .moon2 { fill:var(--violet); opacity:.75; }
    .orbit .track2 { fill:none; stroke:var(--line); stroke-width:.35; stroke-dasharray:1 2; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .disc { position:absolute; inset:9%; border-radius:50%; display:grid; place-items:center; text-align:center;
            background: radial-gradient(circle at 50% 38%, #101a30 0%, #080b14 72%); border:1px solid var(--line); }
    .disc img { width:72%; height:auto; display:block; margin-top:-4%; }
    .disc .word { position:absolute; bottom:15%; left:0; right:0; font-weight:700; letter-spacing:.34em; font-size:clamp(13px,3.4vw,19px);
                  padding-left:.34em; }
    #ring.busy .word { visibility:hidden; }
    #ringtxt { position:absolute; bottom:14%; left:0; right:0; font-weight:700; font-size:clamp(18px,5vw,26px); color:var(--teal); }
    #ring:not(.busy) #ringtxt { display:none; }

    /* ---------- painel ---------- */
    .panel { display:grid; gap:14px; }
    h1 { margin:0; font-size:clamp(26px,4vw,34px); letter-spacing:.2em; line-height:1.1; }
    h1 small { display:block; margin-top:6px; font-size:14px; letter-spacing:.04em; font-weight:500; color:var(--muted); }
    #fwver { margin:-6px 0 0; font-size:13px; color:var(--muted); letter-spacing:.04em; }
    .lead { margin:0; color:#c3cbdb; font-size:14.5px; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; margin:0; padding:0; list-style:none; }
    .chips li { font-size:12.5px; padding:5px 12px; border-radius:999px; border:1px solid var(--line); background:#0b1120; color:#b7c1d6; }
    .chips li i { font-style:normal; color:var(--teal); margin-right:6px; }

    .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:18px 20px; }
    .steps { list-style:none; counter-reset:s; margin:0 0 14px; padding:0; display:grid; gap:10px; }
    .steps li { counter-increment:s; position:relative; padding-left:40px; color:var(--muted); font-size:13.5px; min-height:28px; }
    .steps li::before { content:counter(s); position:absolute; left:0; top:0; width:27px; height:27px; border-radius:50%;
                        border:2px solid var(--teal2); color:var(--teal); display:grid; place-items:center; font-weight:700; font-size:14px; }
    .steps b { color:var(--txt); }
    .you { display:inline-block; margin-left:6px; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
           color:#1a1203; background:var(--amber); border-radius:999px; padding:1px 8px; vertical-align:2px; }

    .req { margin:0 0 14px; padding:9px 12px; border-radius:14px; background:#0a101e; border:1px dashed #263253; font-size:13.5px; color:var(--muted); }
    .req b { color:var(--txt); }

    button#install { width:100%; background:linear-gradient(90deg, var(--teal), #46a0ff); color:#04141a; border:0; border-radius:999px;
                     padding:13px 24px; font-size:16px; font-weight:700; letter-spacing:.02em; cursor:pointer; font-family:inherit; }
    button#install:hover:not(:disabled) { filter:brightness(1.08); }
    button#install:focus-visible { outline:3px solid var(--amber); outline-offset:3px; }
    button#install:disabled { opacity:.5; cursor:default; }
    #status { margin-top:10px; min-height:1.5em; font-weight:600; font-size:14.5px; text-align:center; }
    #status.ok { color:var(--ok); } #status.err { color:var(--err); }
    details { margin-top:12px; }
    summary { cursor:pointer; color:var(--muted); font-size:13px; }
    pre#log { margin:8px 0 0; max-height:150px; overflow:auto; background:#080d19; border:1px solid var(--line);
              border-radius:12px; padding:12px; font-size:12px; line-height:1.45; color:#b9c2d6; white-space:pre-wrap; }
    .warn { margin:12px 0 0; font-size:13px; color:var(--muted); }
    .warn b { color:var(--amber); }
    /* 2º chip da placa (ESP32 clássico): pôr para dormir */
    .card2 h2 { margin:0 0 6px; font-size:15px; letter-spacing:.04em; }
    .card2 .note { margin:0 0 12px; font-size:13.5px; color:var(--muted); }
    .card2 .note b { color:var(--txt); }
    button.sec { width:100%; background:#0b1120; color:var(--teal); border:1.5px solid var(--teal2); border-radius:999px;
                 padding:12px 24px; font-size:15px; font-weight:700; letter-spacing:.02em; cursor:pointer; font-family:inherit; }
    button.sec:hover:not(:disabled) { background:#0f1a2e; }
    button.sec:focus-visible { outline:3px solid var(--amber); outline-offset:3px; }
    button.sec:disabled { opacity:.5; cursor:default; }
    .out { display:grid; gap:4px; }
    footer { font-size:12px; color:#5d6880; line-height:1.6; }

    @media (max-width: 860px) {
      .wrap { grid-template-columns:1fr; min-height:0; padding-top:24px; }
      #ring { width:min(70vw, 300px); }
      .panel { text-align:left; }
    }
    /* idioma */
    .lang { position:fixed; top:14px; right:16px; display:flex; gap:4px; padding:4px; border-radius:999px;
            background:#0b1120; border:1px solid var(--line); z-index:5; }
    .lang button { border:0; background:none; color:var(--muted); font-family:inherit; font-size:12px; font-weight:600;
                   line-height:1; padding:6px 10px; border-radius:999px; cursor:pointer; }
    .lang button[aria-pressed="true"] { background:var(--teal); color:#04141a; }
    .lang button:focus-visible { outline:2px solid var(--amber); }
    /* as luas giram sempre (fazem parte do logo); com movimento reduzido so ficam mais lentas */
    @media (prefers-reduced-motion: reduce) { .spin { animation-duration:30s; } .spin.rev { animation-duration:45s; } .orbit .prog { transition:none; } }
  </style>
</head>

      cpWrong: "Unexpected chip: ", cpSingle: "This board's 2nd chip is single core and this firmware is dual core. Nothing was written.",
      cpCrypt: "The 2nd chip has flash encryption or secure boot. Nothing was written.", cpSize: "Unexpected flash size: ",
      cpVerFail: "The flash didn't verify (MD5). Try again.",
    },
    es: {

      s1: '<b>Revisa la placa.</b> El instalador es solo para el <b>Waveshare ESP32-S3 Knob 1,8"</b>.',

      foot: "Grabación con esptool-js (Espressif).",

      noPort: "No se eligió ningún puerto.", fail: "Falló: ",
      h2: "2.º chip: ahorro de batería",
      cpNote: "El Knob tiene un <b>segundo procesador</b> (ESP32) conectado directo a la batería. Ejecuta su propio firmware (de fábrica, audio Bluetooth) y sigue despierto incluso con la pantalla apagada; Orbit-Life no usa ese chip. Haz esto <b>una vez por placa</b>: <b>gira el conector USB-C 180°</b>, haz clic y elige el puerto de la lista: solo aparece el 2.º chip, con un nombre genérico como <b>COM3</b>. Si la lista sale vacía, el conector sigue del lado del chip principal: gíralo y vuelve a hacer clic.",
      btn2: "Poner a dormir el 2.º chip",
      cpConn: "Conectando al 2.º chip...",

      cpDone: "¡Listo! El 2.º chip ahora duerme. Vuelve a girar el conector USB-C para usar la placa.",

      cpWrong: "Chip inesperado: ", cpSingle: "El 2.º chip de esta placa es de un solo núcleo y este firmware es de doble núcleo. No se grabó nada.",

    },
    ja: {
      sub: 'Waveshare ESP32-S3 Knob 1.8" 用ライフカウンター',
      lead: "ノブと円形ディスプレイのためのTCG・ボードゲーム用カウンター。1〜4人対応で、プレイヤーごとの色、統率者パネル、よく遊ばれるフォーマットのテーマと初期ライフを用意しています。",
      c1: "ダイス・コイントス", c2: "RPGモード", c3: "ミニゲーム",
      c4: "統率者：ダメージ・毒・モナーク", c5: "プレイヤーごとの色", c6: "バッテリー節約",
      s1: '<b>ボードを確認。</b>このインストーラーは <b>Waveshare ESP32-S3 Knob 1.8"</b> 専用です。',
      s2: "<b>USBで接続。</b><b>データ通信対応</b>のUSB-Cケーブルを使い、VS Code・Arduino IDE・他のインストーラーを閉じてください。",
      s3: '<b>インストール。</b>ボタンを押し、リストのポートを選択します（表示されるのはこのボードだけで、名前は <b>COM6</b> のような汎用名です）。<span class="you">操作</span>',
      s4: "<b>完了。</b>書き込みは約1分、Knobは自動で再起動します。",
      req: "<b>必要なもの：</b><b>Chrome または Edge</b> のパソコン（スマホでは書き込めません）。",
      btn: "Orbit-Life をインストール", det: "書き込みの詳細",
      warn: "<b>リストが空？</b>USB-C コネクタを180°反転して、もう一度クリックしてください。<b>接続できない？</b>ケーブルを抜き、<b>BOOT</b> を押したまま接続し、BOOT を離して再試行してください。",
      foot: "書き込みは esptool-js（Espressif）。",
      ver: (v) => `ファームウェア v${v.version} · ビルド ${v.date}`,
      noSerial: "このブラウザは Web Serial に対応していません。パソコンの Chrome か Edge を使ってください。",
      dl: "ファームウェアをダウンロード中...", conn: "Knob に接続中...", wr: "書き込み中...",
      done: "完了！Orbit-Life をインストールしました。画面が点かない場合は Knob の電源を入れ直してください。",
      noPort: "ポートが選択されていません。", fail: "失敗: ",
      h2: "第2チップ：バッテリー節約",
      cpNote: "Knob には<b>2つ目のプロセッサー</b>（ESP32）があり、バッテリーに直結しています。独自のファームウェア（工場出荷時は Bluetooth オーディオ）で動き、画面が消えていても起きたままです。Orbit-Life はこのチップを使いません。<b>ボードごとに1回</b>：<b>USB-C コネクタを180°反転</b>し、ボタンを押してリストのポートを選択します（表示されるのは第2チップだけで、名前は <b>COM3</b> のような汎用名です）。リストが空の場合、コネクタはまだメインチップ側です。反転してもう一度クリックしてください。",
      btn2: "第2チップをスリープさせる",
      cpConn: "第2チップに接続中...",
      cpWr: "消去してスリープ用ファームウェアを書き込み中...", cpVer: "書き込みを確認中...",
      cpDone: "完了！第2チップはスリープしました。USB-C を元の向きに戻してください。",
      cpIsMain: "これはメインチップ（ESP32-S3）のポートです。USB-C を180°反転して、もう一度クリックしてください。",
      cpWrong: "想定外のチップ: ", cpSingle: "このボードの第2チップはシングルコアで、このファームウェアはデュアルコア用です。何も書き込んでいません。",
      cpCrypt: "第2チップはフラッシュ暗号化またはセキュアブートが有効です。何も書き込んでいません。", cpSize: "想定外のフラッシュサイズ: ",
      cpVerFail: "書き込みの検証（MD5）に失敗しました。もう一度お試しください。",
    },
  };
  const pick = () => {
    try { const l = localStorage.getItem("lang"); if (I18N[l]) return l; } catch (_) {}
    const n = (navigator.language || "").toLowerCase();
    return n.startsWith("ja") ? "ja" : n.startsWith("pt") ? "pt" : n.startsWith("es") ? "es" : "en";
  };
  let lang = pick(), fw = null, lastStatus = null;
  const T = (k) => I18N[lang][k];
  function applyLang(l) {
    lang = l;
    try { localStorage.setItem("lang", l); } catch (_) {}
    document.documentElement.lang = l === "pt" ? "pt-BR" : l;
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.innerHTML = T(el.dataset.i18n); });
    document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.l === l));
    if (fw) $("fwver").textContent = T("ver")(fw);
    if (lastStatus) setStatus(lastStatus.k, lastStatus.cls, lastStatus.extra);
  }

  const $ = (id) => document.getElementById(id);
  const btn = $("install"), statusEl = $("status"), logEl = $("log");
  const btns = [btn, $("sleep")];
  const busy = (on) => btns.forEach((b) => { b.disabled = on; });
  const log = (s) => { logEl.textContent += s; logEl.scrollTop = logEl.scrollHeight; };
  const terminal = { clean() { logEl.textContent = ""; }, writeLine(d) { log(d + "\n"); }, write(d) { log(d); } };
  const setStatus = (k, cls = "", extra = "") => { lastStatus = { k, cls, extra }; statusEl.textContent = T(k) + extra; statusEl.className = cls; };
  const setProgress = (pct) => {
    $("ring").classList.add("busy");
    $("ring").style.setProperty("--p", pct);
    $("ringtxt").textContent = pct + "%";
  };

  fetch("version.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : null).then(v => {
    if (v) { fw = v; $("fwver").textContent = T("ver")(v); }
  }).catch(() => {});

  document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => applyLang(b.dataset.l)));
  applyLang(lang);

  if (!("serial" in navigator)) {
    busy(true);
    setStatus("noSerial", "err");
  }

  btn.addEventListener("click", async () => {
    let transport;
    busy(true);
    terminal.clean();
    lastStatus = null;
    try {
      const port = await navigator.serial.requestPort({ filters: ESPRESSIF_USB });   // só o chip principal aparece
      setStatus("dl");
      const resp = await fetch(FIRMWARE, { cache: "no-cache" });
      if (!resp.ok) throw new Error(`Falha ao baixar ${FIRMWARE}: HTTP ${resp.status}`);
      const data = new Uint8Array(await resp.arrayBuffer());
      log(`Firmware: ${data.length} bytes\n`);

      setStatus("conn");
      transport = new Transport(port, false);
      const loader = new ESPLoader({ transport, baudrate: 115200, romBaudrate: 115200, terminal });
      const chip = await loader.main();
      if (!String(chip).includes("ESP32-S3")) throw new Error(`Chip detectado: ${chip}. Esperado ESP32-S3 (vire o conector USB-C).`);

      if (!loader.IS_STUB) {
        // Igual ao esptool.py: a ROM so liga a flash se pedirmos (SPI_ATTACH, 8 bytes: hspi_arg + is_legacy)
        // e precisa saber o tamanho dela (SPI_SET_PARAMS). O esptool-js pula isso no Secure Download Mode.
        log("Enabling default SPI flash mode...\n");
        await loader.checkCommand("configure SPI flash pins", loader.ESP_SPI_ATTACH, new Uint8Array(8));
        const p = new DataView(new ArrayBuffer(24));
        [0, 16 * 1024 * 1024, 64 * 1024, 4 * 1024, 256, 0xffff].forEach((v, i) => p.setUint32(i * 4, v, true));
        await loader.checkCommand("set SPI params", 0x0b, new Uint8Array(p.buffer));
        // Sem stub quem grava e a ROM, que so aceita blocos de 1 KB (o esptool-js deixa 16 KB, tamanho do stub).
        loader.FLASH_WRITE_SIZE = loader.chip.FLASH_WRITE_SIZE || 0x400;
        log(`Block size: 0x${loader.FLASH_WRITE_SIZE.toString(16)}\n`);
      }

      setStatus("wr");
      setProgress(0);
      await loader.writeFlash({
        fileArray: [{ data, address: 0x0 }],
        flashSize: "16MB",
        flashMode: "keep",
        flashFreq: "keep",
        eraseAll: false,
        compress: false,          // igual ao upload do VS Code (--no-compress)
        reportProgress: (_i, written, total) => setProgress(Math.floor((written / total) * 100)),
      });
      setProgress(100);
      // Reinicia o Knob sozinho. O loader.after("hard_reset") do esptool-js so SOLTA o RTS; sem antes
      // SEGURAR o reset (RTS=1, DTR=0) nada acontece. Mesma sequencia do esptool.py e do ESP Web Tools.
      log("Reiniciando a placa...\n");
      await transport.setDTR(false);
      await transport.setRTS(true);
      await new Promise((r) => setTimeout(r, 200));
      await transport.setRTS(false);
      await new Promise((r) => setTimeout(r, 300));
      setStatus("done", "ok");
    } catch (err) {
      console.error(err);
      log("\nERRO: " + (err && err.message ? err.message : err) + "\n");
      $("det").open = true;
      if (err && err.name === "NotFoundError") setStatus("noPort", "err"); else setStatus("fail", "err", String(err.message || err));
    } finally {
      try { if (transport) await transport.disconnect(); } catch (_) {}
      busy(false);
    }
  });

  // ================== 2º chip (ESP32 clássico, porta CH340 com o USB-C virado) ==================
  // Firmware de sono: silencia o DAC e deixa o chip em sono profundo (Orbit-Life/coproc).
  const COPRO_FW = "orbit-life-coproc-sleep.bin";   // imagem completa, offset 0x0
  class UserErr extends Error { constructor(key, extra = "") { super(key); this.key = key; this.extra = extra; } }

  // MD5 (RFC 1321): confere a gravação contra o MD5 que o próprio chip calcula
  function md5(bytes) {
    const S = [7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,
               4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
    const K = new Uint32Array(64);
    for (let i = 0; i < 64; i++) K[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296) >>> 0;
    const n = bytes.length, blocks = ((n + 8) >>> 6) + 1;
    const buf = new Uint8Array(blocks * 64); buf.set(bytes); buf[n] = 0x80;
    const dv = new DataView(buf.buffer);
    dv.setUint32(blocks * 64 - 8, (n * 8) >>> 0, true);
    dv.setUint32(blocks * 64 - 4, Math.floor(n / 536870912), true);
    let a0 = 0x67452301, b0 = 0xefcdab89, c0 = 0x98badcfe, d0 = 0x10325476;
    const M = new Uint32Array(16);
    for (let off = 0; off < buf.length; off += 64) {
      for (let i = 0; i < 16; i++) M[i] = dv.getUint32(off + i * 4, true);
      let A = a0, B = b0, C = c0, D = d0;
      for (let i = 0; i < 64; i++) {
        let F, g;
        if (i < 16) { F = (B & C) | (~B & D); g = i; }
        else if (i < 32) { F = (D & B) | (~D & C); g = (5 * i + 1) & 15; }
        else if (i < 48) { F = B ^ C ^ D; g = (3 * i + 5) & 15; }
        else { F = C ^ (B | ~D); g = (7 * i) & 15; }
        F = (F + A + K[i] + M[g]) >>> 0;
        A = D; D = C; C = B;
        B = (B + ((F << S[i]) | (F >>> (32 - S[i])))) >>> 0;
      }
      a0 = (a0 + A) >>> 0; b0 = (b0 + B) >>> 0; c0 = (c0 + C) >>> 0; d0 = (d0 + D) >>> 0;
    }
    const out = new DataView(new ArrayBuffer(16));
    [a0, b0, c0, d0].forEach((v, i) => out.setUint32(i * 4, v, true));
    return Array.from(new Uint8Array(out.buffer), (x) => x.toString(16).padStart(2, "0")).join("");
  }

  // conecta e confere: ESP32 clássico, dual core, sem criptografia/secure boot, flash de 4 MB
  async function coproConnect(transport) {
    const loader = new ESPLoader({ transport, baudrate: 460800, romBaudrate: 115200, terminal });   // o CH340 perde bytes a 921600
    const chip = await loader.main();
    const name = loader.chip && loader.chip.CHIP_NAME;
    if (name === "ESP32-S3") throw new UserErr("cpIsMain");
    if (name !== "ESP32") throw new UserErr("cpWrong", String(chip));
    const feats = (await loader.chip.getChipFeatures(loader)).join(",");
    log(`Chip: ${chip} |${feats}\n`);
    if (/single core/i.test(feats)) throw new UserErr("cpSingle");
    const w0 = await loader.chip.readEfuse(loader, 0), w6 = await loader.chip.readEfuse(loader, 6);
    let crypt = (w0 >>> 20) & 0x7f, bits = 0;
    while (crypt) { bits += crypt & 1; crypt >>>= 1; }
    if (bits % 2 === 1 || ((w6 >>> 4) & 1)) throw new UserErr("cpCrypt");
    const size = await loader.detectFlashSize();
    log(`Flash: ${size}\n`);
    if (size !== "4MB") throw new UserErr("cpSize", String(size));
    return loader;
  }

  async function writeVerified(loader, data, eraseAll) {
    await loader.writeFlash({
      fileArray: [{ data, address: 0x0 }],
      flashSize: "keep", flashMode: "keep", flashFreq: "keep",
      eraseAll, compress: true,
      reportProgress: (_i, written, total) => setProgress(Math.floor((written / total) * 100)),
    });
    setStatus("cpVer");
    const want = md5(data), got = await loader.flashMd5sum(0, data.length);
    log(`MD5 arquivo ${want} | chip ${got}\n`);
    if (want !== got) throw new UserErr("cpVerFail");
  }

  async function resetChip(transport) {
    log("Reiniciando o 2º chip...\n");
    await transport.setDTR(false);
    await transport.setRTS(true);
    await new Promise((r) => setTimeout(r, 200));
    await transport.setRTS(false);
    await new Promise((r) => setTimeout(r, 300));
  }

  function showErr(err) {
    console.error(err);
    log("\nERRO: " + (err && err.message ? err.message : err) + "\n");
    $("det").open = true;
    if (err instanceof UserErr) setStatus(err.key, "err", err.extra);
    else if (err && err.name === "NotFoundError") setStatus("noPort", "err");
    else setStatus("fail", "err", String((err && err.message) || err));
  }

  $("sleep").addEventListener("click", async () => {
    let transport;
    busy(true);
    terminal.clean();
    lastStatus = null;
    try {
      const port = await navigator.serial.requestPort({ filters: USB_UART });   // só a ponte USB-serial do 2º chip aparece
      setStatus("dl");
      const resp = await fetch(COPRO_FW, { cache: "no-cache" });
      if (!resp.ok) throw new Error(`Falha ao baixar ${COPRO_FW}: HTTP ${resp.status}`);
      const fwData = new Uint8Array(await resp.arrayBuffer());
      log(`Firmware de sono: ${fwData.length} bytes\n`);

      setStatus("cpConn");
      transport = new Transport(port, false);
      const loader = await coproConnect(transport);

      setStatus("cpWr");
      setProgress(0);
      await writeVerified(loader, fwData, true);      // apaga o chip inteiro antes de gravar
      setProgress(100);
      await resetChip(transport);
      setStatus("cpDone", "ok");
    } catch (err) {
      showErr(err);
    } finally {
      try { if (transport) await transport.disconnect(); } catch (_) {}
      busy(false);
    }
  });
</script>
